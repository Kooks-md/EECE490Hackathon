name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Unit and end-to-end tests
        run: python -m pytest -q tests
      - name: Smoke benchmark (synthetic, 2 datasets per task, no contract failures allowed)
        run: |
          python bench/make_synthetic.py /tmp/bench --per-task 2 --seed 7
          python bench/run.py --data /tmp/bench --out /tmp/results.json
          python -c "import json,sys; r=json.load(open('/tmp/results.json')); bad=[x['dataset'] for x in r if x['contract_errors']]; print('contract failures:', bad); sys.exit(1 if bad else 0)"
